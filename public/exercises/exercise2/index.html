<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>VICO | Foundation 1 · Exercise 2</title>
<style>
:root{--blue:#3478f6;--ink:#20304a;--line:#dce5f2;--bg:#f4f7fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--ink)}header{background:linear-gradient(120deg,#2458cf,#6b8cff);color:white;text-align:center;padding:25px 16px}header h1{margin:8px 0}main{max-width:720px;margin:22px auto;padding:0 14px}.progress,.card,.result{background:white;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 5px 18px #20304a0b}.progressrow{display:flex;justify-content:space-between;font-weight:bold;font-size:14px;margin-bottom:10px}.bar{height:10px;background:#e9eef8;border-radius:20px;overflow:hidden}.bar span{display:block;height:100%;width:0;background:#36bd8b;transition:width .2s}.tag{font-size:13px;color:#526581;font-weight:bold}.question{font-size:22px;line-height:1.45;font-weight:bold;margin:14px 0 20px}.options{display:grid;gap:10px}.opt{border:2px solid var(--line);border-radius:12px;padding:13px;text-align:left;background:white;color:var(--ink);font-size:17px;cursor:pointer}.opt.selected{border-color:var(--blue);background:#edf3ff}.opt:disabled{cursor:default}.opt.correct{border-color:#21a779;background:#e4fbf1}.opt.wrong{border-color:#e35d6a;background:#fff0f1}.answer{width:100%;padding:13px;border:2px solid var(--line);border-radius:12px;font-size:17px}.feedback{min-height:24px;margin-top:14px;font-weight:bold}.good{color:#14835e}.bad{color:#c0394b}.actions{display:flex;gap:10px;margin-top:20px}.btn{border:0;border-radius:12px;padding:13px 18px;background:var(--blue);color:white;font-weight:bold;font-size:16px;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#e8edf6;color:#34445e}.result{text-align:center;display:none}.score{font-size:46px;font-weight:800;color:#168b66}@media(max-width:520px){.question{font-size:20px}.card,.progress{padding:16px}}
</style></head><body><header><div>V I C O</div><h1>Computer Fun Exercise 💻</h1><p>Foundation 1 · Exercise 2 · One question at a time</p></header><main><section class="progress"><div class="progressrow"><span id="counter">Question 1</span><span id="percent">0% complete</span></div><div class="bar"><span id="bar"></span></div></section><section class="card" id="quiz"><div class="tag" id="section"></div><div class="question" id="prompt"></div><div id="answerArea"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn" id="submit" disabled>Submit answer</button><button class="btn" id="next" style="display:none">Next question →</button></div></section><section class="result" id="result"><div style="font-size:42px">🎉</div><h2>Exercise completed!</h2><div class="score" id="score"></div><p id="summary"></p><button class="btn" onclick="location.reload()">Try again ↻</button></section></main><script>
const qs=[
{section:'I. Tick the correct option',q:'I have different keys for typing.',opts:['Printer','Keyboard','Monitor','CPU'],a:1},
{section:'I. Tick the correct option',q:'I look like a television and help people watch movies and cartoons.',opts:['Printer','Keyboard','Monitor','CPU'],a:2},
{section:'I. Tick the correct option',q:'I am the brain of the computer and all parts of the computer are connected to me.',opts:['Printer','Monitor','CPU','Keyboard'],a:2},
{section:'I. Tick the correct option',q:'I help print the pictures for your homework.',opts:['Printer','Keyboard','Monitor','CPU'],a:0},
{section:'II. Fill in the blanks',q:'We can watch movies and cartoons on the _____.',opts:['Buttons','Monitor','CPU','Printer','Keyboard'],a:1},
{section:'II. Fill in the blanks',q:'You can take the print of your homework on a _____.',opts:['Buttons','Monitor','CPU','Printer','Keyboard'],a:3},
{section:'II. Fill in the blanks',q:'Mouse has two _____ and a wheel.',opts:['Buttons','Monitor','CPU','Printer','Keyboard'],a:0},
{section:'II. Fill in the blanks',q:'_____ is the brain of the computer.',opts:['Buttons','Monitor','CPU','Printer','Keyboard'],a:2},
{section:'II. Fill in the blanks',q:'_____ looks like a calculator.',opts:['Buttons','Monitor','CPU','Printer','Keyboard'],a:4},
{section:'III. True or False',q:'Keyboard is the brain of the computer.',opts:['True','False'],a:1},
{section:'III. True or False',q:'Mouse is used to draw pictures.',opts:['True','False'],a:0},
{section:'III. True or False',q:'CPU is used to print pictures on a paper.',opts:['True','False'],a:1},
{section:'III. True or False',q:'Monitor shows the work done on the computer.',opts:['True','False'],a:0},
{section:'IV. Complete the names',q:'Complete the computer part name: M _ _ SE',text:true,a:'MOUSE'},
{section:'IV. Complete the names',q:'Complete the computer part name: K _ YB _ _ RD',text:true,a:'KEYBOARD'},
{section:'IV. Complete the names',q:'Complete the computer part name: M _ N _ T _ R',text:true,a:'MONITOR'},
{section:'IV. Complete the names',q:'Complete the computer part name: PR _ NT _ R',text:true,a:'PRINTER'},
{section:'V. Identify computer parts',q:'Choose the word that is a part of a computer.',opts:['CPU','Rat','Pen','Phone'],a:0},
{section:'V. Identify computer parts',q:'Choose the word that is a part of a computer.',opts:['Blackboard','Mouse','Rat','Phone'],a:1},
{section:'V. Identify computer parts',q:'Choose the word that is a part of a computer.',opts:['Pen','Blackboard','Monitor','Rat'],a:2},
{section:'V. Identify computer parts',q:'Choose the word that is a part of a computer.',opts:['Phone','Pen','Rat','Keyboard'],a:3},
{section:'VI. Answer in one word',q:'Which device is used to draw pictures on the computer?',opts:['Mouse','Printer','Monitor','CPU'],a:0},
{section:'VI. Answer in one word',q:'Which device is used to type a poem?',opts:['Keyboard','Mouse','Monitor','Printer'],a:0},
{section:'VI. Answer in one word',q:'Which is the most important part of a computer?',opts:['CPU','Mouse','Printer','Monitor'],a:0},
{section:'VI. Answer in one word',q:'Which part of the computer can be used to listen to music apart from speakers?',opts:['Headphones','Keyboard','Printer','Mouse'],a:0},
{section:'VII. Smart Thinking — colour pattern',q:'The mouse colours go: Yellow, Green, Yellow, Green. What colour comes next?',opts:['Yellow','Green'],a:0}
];
let idx=0,chosen=null,submitted=false,score=0;const $=id=>document.getElementById(id);
function render(){chosen=null;submitted=false;$('section').textContent=qs[idx].section;$('prompt').textContent=qs[idx].q;$('counter').textContent=`Question ${idx+1} of ${qs.length}`;$('percent').textContent=`${Math.round(idx/qs.length*100)}% complete`;$('bar').style.width=(idx/qs.length*100)+'%';$('feedback').textContent='';$('feedback').className='feedback';$('submit').style.display='inline-block';$('submit').disabled=true;$('next').style.display='none';let q=qs[idx];if(q.text){$('answerArea').innerHTML='<input class="answer" id="typed" placeholder="Type your answer" autocomplete="off">';$('typed').addEventListener('input',()=>{$('submit').disabled=!$('typed').value.trim()})}else{$('answerArea').innerHTML='<div class="options">'+q.opts.map((o,i)=>`<button class="opt" type="button" data-i="${i}">${String.fromCharCode(65+i)}. ${o}</button>`).join('')+'</div>';$('answerArea').querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{if(submitted)return;chosen=Number(b.dataset.i);$('answerArea').querySelectorAll('.opt').forEach(x=>x.classList.toggle('selected',x===b));$('submit').disabled=false}))}}
$('submit').addEventListener('click',()=>{if(submitted)return;const q=qs[idx];let ok;if(q.text){ok=$('typed').value.trim().toUpperCase()===q.a;$('typed').disabled=true}else{ok=chosen===q.a;const buttons=$('answerArea').querySelectorAll('.opt');buttons.forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add('correct');if(i===chosen&&i!==q.a)b.classList.add('wrong')})}submitted=true;if(ok)score++;$('feedback').textContent=ok?'Correct! Well done! 🌟':`Not quite. Correct answer: ${q.text?q.a:q.opts[q.a]}.`;$('feedback').className='feedback '+(ok?'good':'bad');$('submit').style.display='none';$('next').style.display='inline-block';$('next').textContent=idx===qs.length-1?'See my score →':'Next question →';$('percent').textContent=`${Math.round((idx+1)/qs.length*100)}% complete`;$('bar').style.width=((idx+1)/qs.length*100)+'%'});
$('next').addEventListener('click',()=>{if(!submitted)return;idx++;if(idx<qs.length)render();else{$('quiz').style.display='none';$('result').style.display='block';$('score').textContent=`${score}/${qs.length}`;$('summary').textContent=`You answered ${score} questions correctly out of ${qs.length}. Great job practising!`;$('counter').textContent='Completed';$('percent').textContent='100% complete';$('bar').style.width='100%'}});render();
</script></body></html>
